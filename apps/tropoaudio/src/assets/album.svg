<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" fill="#1e293b" />
  <!-- Vinyl record -->
  <circle cx="150" cy="130" r="85" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <!-- Grooves -->
  <circle cx="150" cy="130" r="74" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="150" cy="130" r="64" fill="none" stroke="#334155" stroke-width="1.2" />
  <circle cx="150" cy="130" r="54" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="150" cy="130" r="44" fill="none" stroke="#334155" stroke-width="1.2" />
  <!-- Center label -->
  <circle cx="150" cy="130" r="30" fill="#334155" />
  <circle cx="150" cy="130" r="28" fill="none" stroke="#475569" stroke-width="1" />
  <circle cx="150" cy="130" r="14" fill="none" stroke="#64748b" stroke-width="1" />
  <!-- Spindle hole -->
  <circle cx="150" cy="130" r="6" fill="#1e293b" />
  <!-- Minimal text lines simulation -->
  <rect x="50" y="240" width="200" height="14" rx="7" fill="#334155" />
  <rect x="80" y="265" width="140" height="10" rx="5" fill="#334155" />
</svg>
